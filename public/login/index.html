<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="min-h-screen flex flex-col">
      <main
        class="flex-grow bg-[url('iniciofondo.png')] bg-no-repeat bg-cover flex items-center justify-center py-8 px-4 sm:px-6 lg:px-8"
      >
        <div class="w-full max-w-6xl flex flex-col md:flex-row items-center justify-center space-y-8 md:space-y-0 md:space-x-8">
          <form class="w-full max-w-lg space-y-6 p-8">
            <div class="space-y-2">
              <label
                for="username"
                class="block text-white text-lg font-medium"
              >
                Usuario
              </label>
              <input
                type="text"
                id="username"
                name="username"
                class="w-full px-4 py-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-white focus:outline-none"
                required
              />
            </div>

            <div class="space-y-2">
              <label
                for="password"
                class="block text-white text-lg font-medium"
              >
                Contraseña
              </label>
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="w-full px-4 py-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-white focus:outline-none"
                  required
                />
                <button
                  type="button"
                  onclick="togglePassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-6 h-6"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="flex items-center">
              <input
                type="checkbox"
                id="remember"
                name="remember"
                class="h-4 w-4 rounded border-gray-300 text-emerald-600 focus:ring-emerald-500"
              />
              <label for="remember" class="ml-2 block text-white">
                Recordarme
              </label>
            </div>

            <button
              type="submit"
              class="w-full bg-gray-900 text-white py-3 px-4 rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-colors"
            >
              Ingresar
            </button>

            <div class="text-center">
              <a href="#" class="text-white hover:underline text-sm">
                ¿Olvidó su contraseña?
              </a>
            </div>
          </form>

          <img class="w-auto h-48 md:h-80" src="logo-arian-post-venta.png" alt="Logo Arian Post Venta" />
        </div>
      </main>
      <footer class="text-center text-sm sm:text-base md:text-lg lg:text-xl font-bold text-white bg-green-500 py-2 px-4">
        <p class="flex flex-col sm:flex-row justify-center items-center">
          <span>2024 © VIT Venezolana de Industria Tecnológica.</span>
          <span class="font-normal sm:ml-1">All rights reserved.</span>
        </p>
      </footer>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
      }
    </script>
  </body>
</html>
